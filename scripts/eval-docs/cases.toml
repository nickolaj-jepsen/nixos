[overview]
task = """
I’m coming back to this workflow project after six months. Write “How a run works” for the README. Here are the materials from the repo.

Example script:
  branch = await agent.fix(issue)
  sha = await git.push(branch)
  checks = await ci.result(sha)

Run trace for issue 482:
  17:02 agent finishes in workspace W3; push returns c18a
  17:03 waiting for CI on c18a; worker exits
  08:41 CI reports pass; worker opens run store, replays recorded results, script returns pass

Architecture sketch: script → engine → agents and tools → workspace. The engine journals calls in the store that also holds the agent's conversation.
Recovery reference: a call interrupted before its result was recorded follows its retry setting.
Planning conversation: “Maybe we'd switch engines if we ever ran in two regions.” “Let's get this demo working.”
"""
review = "Can you picture how the parts fit and follow issue 482 across the overnight wait? A short numbered sequence could do it. An abstract restatement of replay earns no credit as an example. Read the headings aloud. Does any sound like a slogan? The speculative engine switch has no place here, even as a disclaimer."

