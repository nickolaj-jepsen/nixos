[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-hub"
version = "0.1.0"
description = "Desktop hub for live coding-agent sessions"
requires-python = ">=3.11"
dependencies = ["markdown-it-py"]

[project.scripts]
agent-hub = "agent_hub.cli:main"

[tool.setuptools]
packages = ["agent_hub"]
