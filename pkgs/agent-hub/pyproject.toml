[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-hub"
version = "0.1.0"
description = "Desktop hub for live coding-agent sessions"
requires-python = ">=3.11"

[project.scripts]
agent-hub = "agent_hub:main"

[tool.setuptools]
py-modules = ["agent_hub"]
