[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wt"
version = "0.2.0"
description = "Throwaway git worktrees, landed into the default branch"
requires-python = ">=3.11"

[project.scripts]
wt = "wt.cli:main"

[tool.setuptools]
packages = ["wt"]
