name: Setup Nix
description: Install Nix with our public substituters; optionally attach the homelab attic cache.

inputs:
  attic-endpoint:
    description: Attic endpoint URL (when set together with attic-token, configures attic for substitution + push)
    required: false
    default: ""
  attic-cache:
    description: Attic cache name
    required: false
    default: ""
  attic-token:
    description: Attic auth token (presence triggers attic configuration)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      with:
        # IFD breaks cross-platform eval (darwin from Linux).
        extra-conf: |
          allow-import-from-derivation = false

    - name: Configure attic
      if: inputs.attic-token != ''
      uses: ryanccn/attic-action@5635a15ef0c5462194ffbd05d1daeddc74625c3a # v0.5.0
      with:
        endpoint: ${{ inputs.attic-endpoint }}
        cache: ${{ inputs.attic-cache }}
        token: ${{ inputs.attic-token }}

    # After attic: `attic use` writes a plain `substituters =` to the user nix.conf, which drops any extras set before it.
    # `extra-substituters` there doesn't take on the runner's (Determinate) Nix, so restate the whole list.
    # cuda at priority 40 (it advertises 50): else attic (41) serves its nvidia/CUDA paths over the homelab's uplink.
    - name: Add public substituters
      shell: bash
      run: |
        conf="${XDG_CONFIG_HOME:-$HOME/.config}/nix/nix.conf"
        mkdir -p "$(dirname "$conf")"
        current=$(nix config show substituters)
        cat >> "$conf" <<EOF
        substituters = $current https://nix-community.cachix.org https://cache.nixos-cuda.org?priority=40
        extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M=
        EOF
        nix config show | grep -E '^(substituters|trusted-public-keys) '
