name: Setup Nix
description: Install Nix with our public substituters; optionally attach the homelab attic cache.

inputs:
  attic-endpoint:
    description: Attic endpoint URL (when set together with attic-token, configures attic for substitution + push)
    required: false
    default: ""
  attic-cache:
    description: Attic cache name
    required: false
    default: ""
  attic-token:
    description: Attic auth token (presence triggers attic configuration)
    required: false
    default: ""

runs:
  using: composite
  steps:
    # All substituters live in the system nix.conf: `attic use` would rewrite the user one with a plain
    # `substituters =` that the runner's Nix then prefers, dropping these. attic is public to read, so it only needs the token to push.
    # cuda at priority 40 (it advertises 50): else attic (41) serves its nvidia/CUDA paths over the homelab's uplink.
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      with:
        # IFD breaks cross-platform eval (darwin from Linux).
        extra-conf: |
          allow-import-from-derivation = false
          extra-substituters = ${{ inputs.attic-token != '' && format('{0}{1}', inputs.attic-endpoint, inputs.attic-cache) || '' }} https://nix-community.cachix.org https://cache.nixos-cuda.org?priority=40
          extra-trusted-public-keys = nixos:yGPW0JSJw+piW/f/7XwmwMdnzz2mUEA8b4Zcco80wkI= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M=

    - name: Configure attic
      if: inputs.attic-token != ''
      uses: ryanccn/attic-action@5635a15ef0c5462194ffbd05d1daeddc74625c3a # v0.5.0
      with:
        endpoint: ${{ inputs.attic-endpoint }}
        cache: ${{ inputs.attic-cache }}
        token: ${{ inputs.attic-token }}
        skip-use: "true"

    - name: Show substituters
      shell: bash
      run: nix config show | grep -E '^(substituters|trusted-public-keys) '
