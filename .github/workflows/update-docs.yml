name: Update docs

on:
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "lib/**"
      - "hosts/**"
      - "flake.nix"
      - "flake.lock"
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: update-docs
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked] git-auto-commit pushes the regenerated docs
        with:
          # The `main` ruleset blocks GITHUB_TOKEN pushes; the owner's PAT bypasses it.
          token: ${{ secrets.BOT_TOKEN || github.token }}
      - uses: ./.github/actions/setup-nix
      - name: Generate docs
        run: |
          out=$(nix build --no-link --print-out-paths .#fireproof-docs)
          install -m 644 "$out" docs/fireproof-options.md
      - name: Commit if changed
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "docs: regenerate fireproof.* options reference"
          file_pattern: docs/fireproof-options.md
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
