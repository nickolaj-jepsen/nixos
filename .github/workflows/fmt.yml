name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - name: Check formatting
        run: nix fmt -- --fail-on-change

  hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - id: list
        name: Enumerate nixosConfigurations
        # Exclude bootstrap-* hosts: those build installer ISOs and aren't worth
        # the matrix slot on every PR. The real hosts are all that's needed for
        # the build gate.
        run: |
          list=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames \
            | jq -c '[ .[] | select(startswith("bootstrap") | not) ]')
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Matrix: $list"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          attic-endpoint: https://attic.${{ secrets.HOMELAB_DOMAIN }}/
          attic-cache: nixos
          attic-token: ${{ secrets.ATTIC_TOKEN }}
      - name: Run nix flake check
        run: nix flake check

  # --skip-cached (in ci-build.sh): a host already in attic passes without pulling its closure onto the runner.
  build:
    needs: [hosts, fmt]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.hosts.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          attic-endpoint: https://attic.${{ secrets.HOMELAB_DOMAIN }}/
          attic-cache: nixos
          attic-token: ${{ secrets.ATTIC_TOKEN }}
      - name: Build ${{ matrix.host }}
        env:
          HOST: ${{ matrix.host }}
        run: .github/scripts/ci-build.sh ".#nixosConfigurations.$HOST.config.system.build.toplevel"

  # The darwin host can't build on Linux (aarch64-darwin), so it gets its own
  # macOS runner instead of a matrix slot. Free on a public repo; needs [fmt]
  # keeps a broken-format PR from spinning it up. Mark this
  # job as a required status check on `main` so a broken Mac config blocks merge.
  darwin:
    needs: [fmt]
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
        with:
          attic-endpoint: https://attic.${{ secrets.HOMELAB_DOMAIN }}/
          attic-cache: nixos
          attic-token: ${{ secrets.ATTIC_TOKEN }}
      - name: Build macbook
        run: .github/scripts/ci-build.sh ".#darwinConfigurations.macbook.system"

  # The required check on `main`: a stable name, unlike the matrix jobs. Skipped counts as failed.
  gate:
    name: CI gate
    if: always()
    needs: [fmt, check, build, darwin]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
