name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-nix
      - name: Check formatting
        run: nix fmt -- --fail-on-change

  hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-nix
      - id: list
        name: Enumerate nixosConfigurations
        # Exclude the installer image (`bootstrap`): it builds an ISO and isn't
        # worth the matrix slot on every PR. The real hosts are all that's needed
        # for the build gate.
        run: |
          list=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames \
            | jq -c '[ .[] | select(startswith("bootstrap") | not) ]')
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Matrix: $list"

  # What `nix flake check` covers minus the real hosts, which the build jobs already evaluate.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-nix
        with:
          attic-endpoint: https://attic.${{ secrets.HOMELAB_DOMAIN }}/
          attic-cache: nixos
          attic-token: ${{ secrets.ATTIC_TOKEN }}
      - name: Build checks
        run: .github/scripts/ci-build.sh ".#checks.x86_64-linux"
      # shell: bash for pipefail; --no-eval-cache: parallel evals otherwise stall on its SQLite lock.
      - name: Evaluate the installer image, packages and dev shells
        shell: bash
        run: |
          nix eval --json .#nixosConfigurations --apply builtins.attrNames \
            | jq -r '.[] | select(startswith("bootstrap"))' \
            | xargs -P 4 -I{} nix eval --no-eval-cache ".#nixosConfigurations.{}.config.system.build.toplevel.drvPath"
          nix eval --json .#packages.x86_64-linux --apply 'builtins.mapAttrs (_: p: p.drvPath)'
          nix eval --json .#devShells.x86_64-linux --apply 'builtins.mapAttrs (_: p: p.drvPath)'

  # --skip-cached (in ci-build.sh): a host already in attic passes without pulling its closure onto the runner.
  # Not gated on fmt: the gate still requires it, and waiting would add its runtime to every build.
  build:
    needs: [hosts]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.hosts.outputs.list) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-nix
        with:
          attic-endpoint: https://attic.${{ secrets.HOMELAB_DOMAIN }}/
          attic-cache: nixos
          attic-token: ${{ secrets.ATTIC_TOKEN }}
      - name: Build ${{ matrix.host }}
        run: .github/scripts/ci-build.sh ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

  # The darwin host can't build on Linux (aarch64-darwin), so it gets its own
  # macOS runner instead of a matrix slot (free on a public repo).
  darwin:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-nix
        with:
          attic-endpoint: https://attic.${{ secrets.HOMELAB_DOMAIN }}/
          attic-cache: nixos
          attic-token: ${{ secrets.ATTIC_TOKEN }}
      - name: Build macbook
        run: .github/scripts/ci-build.sh ".#darwinConfigurations.macbook.system"

  # The required check on `main`: a stable name, unlike the matrix jobs. Skipped counts as failed.
  gate:
    name: CI gate
    if: always()
    needs: [fmt, check, build, darwin]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
