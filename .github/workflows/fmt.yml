name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-nix
      - name: Check formatting
        run: nix fmt -- --fail-on-change

  hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      list: ${{ steps.list.outputs.list }}
      # Builds go to the homelab runner (docs/ci.md) when it's switched on, and only for code that
      # reaches every host anyway: pushes to main and the update bot's PR. Other PRs, agent-written
      # ones included, stay on hosted runners.
      homelab: >-
        ${{ vars.HOMELAB_RUNNER == 'true' && (github.event_name == 'push' || (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'auto/update')) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-nix
      - id: list
        name: Enumerate nixosConfigurations
        # Exclude bootstrap-* hosts: those build installer ISOs and aren't worth
        # the matrix slot on every PR. The real hosts are all that's needed for
        # the build gate.
        run: |
          list=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames \
            | jq -c '[ .[] | select(startswith("bootstrap") | not) ]')
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Matrix: $list"

  # What `nix flake check` covers minus the real hosts, which the build jobs already evaluate.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-nix
        with:
          attic-endpoint: https://attic.${{ secrets.HOMELAB_DOMAIN }}/
          attic-cache: nixos
          attic-token: ${{ secrets.ATTIC_TOKEN }}
      - name: Build checks
        run: .github/scripts/ci-build.sh ".#checks.x86_64-linux"
      # shell: bash for pipefail; --no-eval-cache: parallel evals otherwise stall on its SQLite lock.
      - name: Evaluate bootstrap hosts, packages and dev shells
        shell: bash
        run: |
          nix eval --json .#nixosConfigurations --apply builtins.attrNames \
            | jq -r '.[] | select(startswith("bootstrap"))' \
            | xargs -P 4 -I{} nix eval --no-eval-cache ".#nixosConfigurations.{}.config.system.build.toplevel.drvPath"
          nix eval --json .#packages.x86_64-linux --apply 'builtins.mapAttrs (_: p: p.drvPath)'
          nix eval --json .#devShells.x86_64-linux --apply 'builtins.mapAttrs (_: p: p.drvPath)'

  # --skip-cached (in ci-build.sh): a host already in attic passes without pulling its closure onto the runner.
  # Not gated on fmt: the gate still requires it, and waiting would add its runtime to every build.
  build:
    needs: [hosts]
    if: needs.hosts.outputs.homelab != 'true' || vars.HOMELAB_RUNNER != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.hosts.outputs.list) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-nix
        with:
          attic-endpoint: https://attic.${{ secrets.HOMELAB_DOMAIN }}/
          attic-cache: nixos
          attic-token: ${{ secrets.ATTIC_TOKEN }}
      - name: Build ${{ matrix.host }}
        run: .github/scripts/ci-build.sh ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

  # `build` on the homelab runner. It references no secrets, so none reach the homelab: Nix is
  # already there, and the host's post-build-hook pushes to attic with its own token. The variable
  # is checked again because re-running failed jobs reuses `hosts`' old output.
  build-homelab:
    name: build (${{ matrix.host }})
    needs: [hosts]
    if: needs.hosts.outputs.homelab == 'true' && vars.HOMELAB_RUNNER == 'true'
    runs-on: homelab
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.hosts.outputs.list) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Build ${{ matrix.host }}
        run: .github/scripts/ci-build.sh ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
        env:
          # setup-nix's IFD ban; the homelab's own nix.conf allows IFD.
          NIX_CONFIG: allow-import-from-derivation = false

  # The darwin host can't build on Linux (aarch64-darwin), so it gets its own
  # macOS runner instead of a matrix slot (free on a public repo).
  darwin:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-nix
        with:
          attic-endpoint: https://attic.${{ secrets.HOMELAB_DOMAIN }}/
          attic-cache: nixos
          attic-token: ${{ secrets.ATTIC_TOKEN }}
      - name: Build macbook
        run: .github/scripts/ci-build.sh ".#darwinConfigurations.macbook.system"

  # The required check on `main`: a stable name, unlike the matrix jobs. Skipped counts as failed.
  gate:
    name: CI gate
    if: always()
    needs: [fmt, check, build, build-homelab, darwin]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Exactly one of build/build-homelab runs; the other is skipped by its `if`.
      - name: Require every job to have succeeded
        env:
          RESULTS: >-
            ${{ needs.fmt.result }} ${{ needs.check.result }} ${{ needs.darwin.result }}
            ${{ needs.build-homelab.result == 'skipped' && needs.build.result || needs.build-homelab.result }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
