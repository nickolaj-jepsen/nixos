name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-nix
      - name: Check formatting
        run: nix fmt -- --fail-on-change

  # What `nix flake check` covers minus the real hosts, which the build jobs
  # evaluate, plus the plan for that matrix: a configuration whose toplevel the
  # attic cache can serve was built by an earlier run, so the matrix only
  # carries the hosts this commit actually changes.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      linux: ${{ steps.plan.outputs.linux }}
      darwin: ${{ steps.plan.outputs.darwin }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-nix
        with:
          attic-endpoint: https://attic.${{ secrets.HOMELAB_DOMAIN }}/
          attic-cache: nixos
          attic-token: ${{ secrets.ATTIC_TOKEN }}
      - name: Build checks
        run: .github/scripts/ci-build.sh ".#checks.x86_64-linux"
      # shell: bash for pipefail; --no-eval-cache: parallel evals otherwise stall on its SQLite lock.
      - name: Evaluate the installer image, packages and dev shells
        shell: bash
        run: |
          nix eval --json .#nixosConfigurations --apply builtins.attrNames \
            | jq -r '.[] | select(startswith("bootstrap"))' \
            | xargs -P 4 -I{} nix eval --no-eval-cache ".#nixosConfigurations.{}.config.system.build.toplevel.drvPath"
          nix eval --json .#packages.x86_64-linux --apply 'builtins.mapAttrs (_: p: p.drvPath)'
          nix eval --json .#devShells.x86_64-linux --apply 'builtins.mapAttrs (_: p: p.drvPath)'
      - id: plan
        name: Plan the build matrix
        env:
          ATTIC: https://attic.${{ secrets.HOMELAB_DOMAIN }}/nixos
        run: .github/scripts/ci-plan.sh

  # `if` on the outputs, not on `needs.plan.result`: a plan that fails leaves the
  # outputs empty, and an empty matrix errors instead of skipping.
  # --single: one toplevel per job, so nix-fast-build's parallel eval buys nothing.
  build:
    needs: [plan]
    if: needs.plan.outputs.linux != '' && needs.plan.outputs.linux != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.plan.outputs.linux) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-nix
        with:
          attic-endpoint: https://attic.${{ secrets.HOMELAB_DOMAIN }}/
          attic-cache: nixos
          attic-token: ${{ secrets.ATTIC_TOKEN }}
      - name: Build ${{ matrix.host }}
        run: .github/scripts/ci-build.sh --single ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

  # The darwin host can't build on Linux (aarch64-darwin), so it gets its own
  # macOS runner instead of a matrix slot.
  darwin:
    needs: [plan]
    if: needs.plan.outputs.darwin == 'true'
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-nix
        with:
          attic-endpoint: https://attic.${{ secrets.HOMELAB_DOMAIN }}/
          attic-cache: nixos
          attic-token: ${{ secrets.ATTIC_TOKEN }}
      - name: Build macbook
        run: .github/scripts/ci-build.sh --single ".#darwinConfigurations.macbook.system"

  # Same for the aarch64-linux phone-vm: a native arm runner fills attic so the phone only substitutes.
  phone-vm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-nix
        with:
          attic-endpoint: https://attic.${{ secrets.HOMELAB_DOMAIN }}/
          attic-cache: nixos
          attic-token: ${{ secrets.ATTIC_TOKEN }}
      - name: Build phone-vm
        run: .github/scripts/ci-build.sh --single ".#nixosConfigurations.phone-vm.config.system.build.toplevel"

  # The required check on `main`: a stable name, unlike the matrix jobs. A job the
  # plan skipped is fine; a job that failed, was cancelled, or never ran is not.
  gate:
    name: CI gate
    if: always()
    needs: [fmt, plan, build, darwin, phone-vm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded
        env:
          FMT: ${{ needs.fmt.result }}
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.build.result }}
          DARWIN: ${{ needs.darwin.result }}
          PHONE_VM: ${{ needs.phone-vm.result }}
        run: |
          echo "fmt=$FMT plan=$PLAN build=$BUILD darwin=$DARWIN phone-vm=$PHONE_VM"
          failed=0
          require() {
            [ "$2" = success ] && return
            echo "::error::$1: $2"
            failed=1
          }
          skipped_ok() {
            case "$2" in success | skipped) return ;; esac
            echo "::error::$1: $2"
            failed=1
          }
          require fmt "$FMT"
          require plan "$PLAN"
          require phone-vm "$PHONE_VM"
          # The plan only carries hosts it can prove changed, so both may be skipped.
          skipped_ok build "$BUILD"
          skipped_ok darwin "$DARWIN"
          exit "$failed"
