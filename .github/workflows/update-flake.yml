# Gated by repo settings: a ruleset on `main` requiring `CI gate` (fmt.yml),
# "Allow auto-merge", and GH_AW_GITHUB_TOKEN (fine-grained PAT, contents +
# pull-requests write) — GITHUB_TOKEN PRs get no CI run, so without it the PR sits open.
name: Update flake.lock
on:
  schedule:
    - cron: "0 0 * * *" # Every night at midnight
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: update-flake
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: ./.github/actions/setup-nix
      - uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        id: update
        with:
          token: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
          pr-title: "chore(flake): update flake.lock"
          pr-labels: |
            dependencies
            automated
      - name: Enable auto-merge
        if: steps.update.outputs.pull-request-number != ''
        # `--auto` merges on the spot when nothing is required, so check first.
        run: |
          required=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" \
            --jq 'any(.[]; .type == "required_status_checks")')
          if [ "$required" != true ]; then
            echo "::error::main has no required status checks; leaving PR #$PR open instead of auto-merging unchecked."
            exit 1
          fi
          gh pr merge --auto --rebase "$PR"
        env:
          # A GITHUB_TOKEN merge wouldn't trigger CI on main.
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
          PR: ${{ steps.update.outputs.pull-request-number }}
